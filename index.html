<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="聖經和合本生僻字標音版：全书预排、注音、已识字记忆与快速目录定位。" />
    <title>聖經 · 和合本生僻字標音版</title>
    <script type="module" crossorigin src="./assets/index-anchor-stability.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-GokbOFnL.css">
    <style>
      :root { --reader-fs: 16px; }
      .page-content { font-size: var(--reader-fs) !important; }
      @media (max-width: 759px) {
        .reader-stage { padding: 0; }
        .reader-book-shell, .reader-book-shell.single { width: 100%; }
        .reader-book-shell.single .book-spread { width: 100%; }
        .paper-page { height: calc(100vh - 58px); padding: 18px 20px 30px; }
        .page-side-control { display: none; }
      }
      #fs-ctrl { display: inline-flex; align-items: center; gap: 2px; margin-right: 4px; }
      #fs-ctrl button { min-width: 26px; height: 28px; padding: 0 4px; border: 1px solid #f4e1c047; border-radius: 7px; color: #f8ead4; background: #ffffff14; font: 700 13px 'Noto Serif CJK TC', serif; cursor: pointer; }
      #fs-ctrl button:hover { background: #e1b8773d; }
      #fs-ctrl span { display: grid; min-width: 30px; height: 28px; place-items: center; color: #e9d7b8; font: 600 12px/1 'Noto Serif CJK TC', serif; }
      /* 可拖动的每日灵修悬浮链接：半透明，不遮挡正文 */
      #devotion-link {
        position: fixed; left: 16px; bottom: 16px; z-index: 1000;
        display: inline-flex; align-items: center; gap: 5px;
        padding: 8px 12px; border: 1px solid rgba(244, 225, 192, .28);
        border-radius: 10px; color: #f4e7d0; cursor: grab;
        background: rgba(20, 12, 4, .45); backdrop-filter: blur(6px);
        font: 600 13px 'Noto Serif CJK TC', 'Songti TC', serif; letter-spacing: .04em;
        box-shadow: 0 4px 14px rgba(0, 0, 0, .25); user-select: none;
        -webkit-user-select: none; touch-action: none;
      }
      #devotion-link:active { cursor: grabbing; background: rgba(40, 25, 10, .6); }
      /* 金句定位高亮 */
      .verse-target { background: rgba(233, 200, 120, .3) !important; border-radius: 5px; box-shadow: inset 0 0 0 1.5px rgba(182, 135, 60, .55); }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="devotion-link" role="link" tabindex="0" aria-label="打开每日灵修">每日靈修 📖</div>
    <script>
    (function () {
      var KEY = 'bible-reader-fs-v2'; // v2：默认字号提升为原一倍（16→32），旧 v1 值失效
      var MIN = 24, MAX = 44;
      function apply(size) {
        document.documentElement.style.setProperty('--reader-fs', size + 'px');
        try { localStorage.setItem(KEY, String(size)); } catch (e) {}
        // 字号变化后让 React 重新测量分页
        window.dispatchEvent(new Event('resize'));
        setTimeout(function () { window.dispatchEvent(new Event('resize')); }, 60);
      }
      function mount() {
        if (document.querySelector('#fs-ctrl')) return true;
        var header = document.querySelector('.reader-header');
        var spacer = header && header.querySelector('.header-spacer');
        if (!spacer || !header) return false;
        var size = parseInt(localStorage.getItem(KEY) || '32', 10);
        if (isNaN(size)) size = 32;
        size = Math.max(MIN, Math.min(MAX, size));
        var ctrl = document.createElement('div');
        ctrl.id = 'fs-ctrl';
        ctrl.innerHTML = '<button type="button" data-d="-1" aria-label="减小字号">A−</button><span id="fs-val">' + size + '</span><button type="button" data-d="1" aria-label="增大字号">A+</button>';
        ctrl.addEventListener('click', function (e) {
          var btn = e.target.closest('button');
          if (!btn) return;
          var cur = parseInt(localStorage.getItem(KEY) || '32', 10);
          cur = Math.max(MIN, Math.min(MAX, cur + parseInt(btn.dataset.d, 10)));
          ctrl.querySelector('#fs-val').textContent = cur;
          apply(cur);
        });
        header.insertBefore(ctrl, spacer);
        apply(size);
        return true;
      }
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', function () {
          if (!mount()) new MutationObserver(function () { if (mount()) this.disconnect(); }).observe(document.body, { childList: true, subtree: true });
        });
      } else {
        if (!mount()) new MutationObserver(function () { if (mount()) this.disconnect(); }).observe(document.body, { childList: true, subtree: true });
      }
    })();
    (function () {
      // 可拖动的「每日灵修」悬浮链接：按住拖动，松手判定为点击则跳转；位置持久化到 localStorage。
      var el = document.getElementById('devotion-link');
      var TARGET = 'https://jacksonyangrs.github.io/rehoboth-church-site/devotion/';
      var KEY = 'bible-devotion-link-pos-v1';
      var MOVE_THRESHOLD = 8; // px，超过视为拖动而非点击
      var startX = 0, startY = 0, startLeft = 0, startTop = 0, moved = false;

      try {
        var saved = JSON.parse(localStorage.getItem(KEY) || 'null');
        if (saved && typeof saved.left === 'number') {
          el.style.left = saved.left + 'px';
          el.style.top = saved.top + 'px';
          el.style.bottom = 'auto';
          el.style.right = 'auto';
        }
      } catch (e) {}

      function savePos() {
        try {
          localStorage.setItem(KEY, JSON.stringify({ left: parseInt(el.style.left, 10), top: parseInt(el.style.top, 10) }));
        } catch (e) {}
      }

      el.addEventListener('pointerdown', function (e) {
        moved = false;
        startX = e.clientX; startY = e.clientY;
        startLeft = el.getBoundingClientRect().left;
        startTop = el.getBoundingClientRect().top;
        el.setPointerCapture(e.pointerId);
      });
      el.addEventListener('pointermove', function (e) {
        if (!el.hasPointerCapture(e.pointerId)) return;
        var dx = e.clientX - startX, dy = e.clientY - startY;
        if (Math.abs(dx) > MOVE_THRESHOLD || Math.abs(dy) > MOVE_THRESHOLD) moved = true;
        var rect = el.getBoundingClientRect();
        var left = Math.min(Math.max(0, startLeft + dx), window.innerWidth - rect.width);
        var top = Math.min(Math.max(0, startTop + dy), window.innerHeight - rect.height);
        el.style.left = left + 'px';
        el.style.top = top + 'px';
        el.style.bottom = 'auto';
        el.style.right = 'auto';
      });
      el.addEventListener('pointerup', function () {
        if (moved) savePos();
      });
      el.addEventListener('click', function (e) {
        if (moved) { e.preventDefault(); e.stopPropagation(); moved = false; return; }
        window.location.href = TARGET;
      });
      el.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') window.location.href = TARGET;
      });
    })();
    (function () {
      // 66 卷书卷名映射：繁体 -> 简体（顺序即书目顺序）
      var BOOKS = {"創世記":"创世记","出埃及記":"出埃及记","利未記":"利未记","民數記":"民数记","申命記":"申命记","約書亞記":"约书亚记","士師記":"士师记","路得記":"路得记","撒母耳記上":"撒母耳记上","撒母耳記下":"撒母耳记下","列王紀上":"列王纪上","列王紀下":"列王纪下","歷代志上":"历代志上","歷代志下":"历代志下","以斯拉記":"以斯拉记","尼希米記":"尼希米记","以斯帖記":"以斯帖记","約伯記":"约伯记","詩篇":"诗篇","箴言":"箴言","傳道書":"传道书","雅歌":"雅歌","以賽亞書":"以赛亚书","耶利米書":"耶利米书","耶利米哀歌":"耶利米哀歌","以西結書":"以西结书","但以理書":"但以理书","何西阿書":"何西阿书","約珥書":"约珥书","阿摩司書":"阿摩司书","俄巴底亞書":"俄巴底亚书","約拿書":"约拿书","彌迦書":"弥迦书","那鴻書":"那鸿书","哈巴谷書":"哈巴谷书","西番雅書":"西番雅书","哈該書":"哈该书","撒迦利亞書":"撒迦利亚书","瑪拉基書":"玛拉基书","馬太福音":"马太福音","馬可福音":"马可福音","路加福音":"路加福音","約翰福音":"约翰福音","使徒行傳":"使徒行传","羅馬書":"罗马书","哥林多前書":"哥林多前书","哥林多後書":"哥林多后书","加拉太書":"加拉太书","以弗所書":"以弗所书","腓立比書":"腓立比书","歌羅西書":"歌罗西书","帖撒羅尼迦前書":"帖撒罗尼迦前书","帖撒羅尼迦後書":"帖撒罗尼迦后书","提摩太前書":"提摩太前书","提摩太後書":"提摩太后书","提多書":"提多书","腓利門書":"腓利门书","希伯來書":"希伯来书","雅各書":"雅各书","彼得前書":"彼得前书","彼得後書":"彼得后书","約翰一書":"约翰一书","約翰二書":"约翰二书","約翰三書":"约翰三书","猶大書":"犹大书","啟示錄":"启示录"};
      var D = {一:1,二:2,三:3,四:4,五:5,六:6,七:7,八:8,九:9,十:10,廿:20,卅:30};
      function cnToNum(s) {
        if (!s) return 0;
        if (/^[十廿卅]$/.test(s)) return D[s];
        var m = s.match(/^([一二三四五六七八九])?([十廿卅])([一二三四五六七八九])?$/);
        if (m) return (m[1] ? D[m[1]] : 1) * D[m[2]] + (m[3] ? D[m[3]] : 0);
        if (s.length === 1) return D[s] || 0;
        return 0;
      }
      function parseRef() {
        var params = new URLSearchParams(location.search);
        var ref = params.get('ref') || params.get('reference') || '';
        if (!ref) return null;
        var names = Object.keys(BOOKS), idx = -1;
        for (var i = 0; i < names.length; i++) {
          if (ref.indexOf(BOOKS[names[i]]) === 0 || ref.indexOf(names[i]) === 0) { idx = i; break; }
        }
        if (idx < 0) return null;
        var bookName = ref.indexOf(BOOKS[names[idx]]) === 0 ? BOOKS[names[idx]] : names[idx];
        var rest = ref.slice(bookName.length);
        var ch = rest.match(/([一二三四五六七八九十廿卅]+)章/);
        if (!ch) return null;
        var chapter = cnToNum(ch[1]);
        if (!chapter) return null;
        // 节号（可选）：取"X节"或"X至Y节"中的起始节
        var vs = rest.match(/([一二三四五六七八九十廿卅]+)(?:至[一二三四五六七八九十廿卅]+)?节/);
        var verse = vs ? cnToNum(vs[1]) : 0;
        return { book: idx, chapter: chapter - 1, verse: verse > 0 ? verse - 1 : 0 };
      }
      function findVerse(v) {
        var verses = document.querySelectorAll('.paper-page .verse');
        for (var i = 0; i < verses.length; i++) {
          var sup = verses[i].querySelector('sup');
          if (sup && parseInt(sup.textContent, 10) === v + 1) return verses[i];
        }
        return null;
      }
      function jump(target) {
        if (!target) return;
        var step = 0, tries = 0, searchTries = 0;
        var timer = setInterval(function () {
          tries++;
          if (tries > 150) { clearInterval(timer); return; }
          if (step === 0) {
            var bookBtns = document.querySelectorAll('.toc-book-button');
            if (bookBtns.length === 0) {
              var tocBtn = document.querySelector('button.control.primary-control');
              if (tocBtn) tocBtn.click();
              return;
            }
            var b = bookBtns[target.book];
            if (b) { b.click(); step = 1; }
          } else if (step === 1) {
            var grid = document.querySelector('.chapter-grid');
            if (!grid) return;
            var btns = grid.querySelectorAll('button');
            if (btns.length > target.chapter) {
              btns[target.chapter].click();
              step = 2;
              searchTries = 0;
            } else { clearInterval(timer); }
          } else if (step === 2) {
            // 在当前页找目标节；找不到则翻下一页（最多 80 页）
            var found = findVerse(target.verse);
            if (found) {
              found.classList.add('verse-target');
              try { found.scrollIntoView({ block: 'center', behavior: 'smooth' }); } catch (e) { found.scrollIntoView(); }
              clearInterval(timer);
              return;
            }
            searchTries++;
            if (searchTries > 80) { clearInterval(timer); return; }
            var nextBtn = document.querySelector('.page-side-control.next-page-control');
            if (nextBtn) nextBtn.click();
            else clearInterval(timer);
          }
        }, 250);
      }
      function start() { jump(parseRef()); }
      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
      else start();
    })();
    </script>
  </body>
</html>
